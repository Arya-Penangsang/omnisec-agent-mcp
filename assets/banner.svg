<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0B101D"/>
      <stop offset="100%" stop-color="#080D1A"/>
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <radialGradient id="purpleGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="85%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0070F3" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#0070F3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="50%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Shield Interior Gradient -->
    <linearGradient id="shieldInterior" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F3F4F6"/>
      <stop offset="70%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.25"/>
    </pattern>

    <!-- Filters -->
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#purpleGlow)"/>
  <rect width="1200" height="420" fill="url(#cyanGlow)"/>
  <rect width="1200" height="420" fill="url(#greenGlow)"/>
  <rect width="1200" height="420" fill="url(#dotGrid)"/>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="16" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Ambient Grid Lines -->
  <path d="M 0 110 L 1200 110 M 0 310 L 1200 310" stroke="#1E293B" stroke-width="0.5" stroke-dasharray="4 8" stroke-opacity="0.4"/>
  <path d="M 380 0 L 380 420 M 820 0 L 820 420" stroke="#1E293B" stroke-width="0.5" stroke-dasharray="4 8" stroke-opacity="0.4"/>

  <!-- Top Badge: Version & Protocol -->
  <g transform="translate(60, 48)">
    <rect width="270" height="30" rx="15" fill="#1E293B" fill-opacity="0.6" stroke="#475569" stroke-width="1"/>
    <circle cx="15" cy="15" r="4" fill="#10B981" filter="url(#neonBlur)"/>
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" letter-spacing="0.08em">MCP PROTOCOL v2024-11-05</text>
    <rect x="200" y="6" width="62" height="18" rx="9" fill="#10B981" fill-opacity="0.2"/>
    <text x="231" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" fill="#34D399" letter-spacing="0.05em">v2.1.0</text>
  </g>

  <!-- Left: Glowing Cyber Shield Emblem -->
  <g transform="translate(90, 115)">
    <!-- Shield Outer Aura -->
    <path d="M 90 20 L 155 52 C 155 130 115 178 90 195 C 65 178 25 130 25 52 Z" fill="#7928CA" fill-opacity="0.25" filter="url(#neonBlur)"/>
    <!-- Shield Base -->
    <path d="M 90 20 L 155 52 C 155 130 115 178 90 195 C 65 178 25 130 25 52 Z" fill="url(#shieldInterior)" stroke="url(#shieldBorder)" stroke-width="2.5"/>
    
    <!-- Shield Inner Circuit Core -->
    <path d="M 90 40 L 138 65 C 138 122 108 158 90 172 C 72 158 42 122 42 65 Z" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="3 3"/>
    
    <!-- Lock / Core Nexus -->
    <rect x="75" y="98" width="30" height="24" rx="4" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5" filter="url(#neonBlur)"/>
    <path d="M 80 98 L 80 88 C 80 82 85 78 90 78 C 95 78 100 82 100 88 L 100 98" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="90" cy="108" r="3" fill="#FFFFFF"/>
    <path d="M 90 111 L 90 116" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- Dynamic Orbit Pulses -->
    <circle cx="90" cy="110" r="60" fill="none" stroke="#C084FC" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="8 12"/>
    <circle cx="90" cy="110" r="75" fill="none" stroke="#34D399" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 16"/>
  </g>

  <!-- Center/Right: Typography & Value Proposition -->
  <g transform="translate(300, 115)">
    <!-- Main Title -->
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.02em">
      OMNISEC AGENT MCP
    </text>

    <!-- Subtitle -->
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="18" font-weight="600" fill="#94A3B8" letter-spacing="0.01em">
      Universal Cybersecurity MCP Server &amp; Token-Efficient Agent Skills
    </text>

    <!-- Efficiency Highlight Bar -->
    <g transform="translate(0, 96)">
      <rect width="520" height="28" rx="6" fill="#131B2E" stroke="#2563EB" stroke-width="1" stroke-opacity="0.4"/>
      <text x="14" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38BDF8">
        ⚡ CAVEMAN OPTIMIZATION:
      </text>
      <text x="195" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#E2E8F0">
        Cut input/output context bloat by <tspan font-weight="800" fill="#34D399">80% – 98%</tspan>
      </text>
    </g>

    <!-- Feature Badges Row 1 -->
    <g transform="translate(0, 142)">
      <!-- Badge 1: Purple Team -->
      <g transform="translate(0, 0)">
        <rect width="195" height="34" rx="8" fill="url(#pillBg)" stroke="#7C3AED" stroke-width="1" stroke-opacity="0.6"/>
        <text x="12" y="21" font-size="14">🟣</text>
        <text x="34" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#DDD6FE">Purple Team Triad</text>
      </g>

      <!-- Badge 2: Malware Triage -->
      <g transform="translate(205, 0)">
        <rect width="215" height="34" rx="8" fill="url(#pillBg)" stroke="#0284C7" stroke-width="1" stroke-opacity="0.6"/>
        <text x="12" y="21" font-size="14">🔬</text>
        <text x="34" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#BAE6FD">Malware PE &amp; Entropy</text>
      </g>

      <!-- Badge 3: Forensics -->
      <g transform="translate(430, 0)">
        <rect width="190" height="34" rx="8" fill="url(#pillBg)" stroke="#059669" stroke-width="1" stroke-opacity="0.6"/>
        <text x="12" y="21" font-size="14">🔍</text>
        <text x="34" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A7F3D0">DFIR &amp; USB History</text>
      </g>
    </g>

    <!-- Feature Badges Row 2 (Compatibility Platforms) -->
    <g transform="translate(0, 186)">
      <!-- Badge 4: Dual Runtime -->
      <g transform="translate(0, 0)">
        <rect width="235" height="30" rx="6" fill="#0B132B" stroke="#334155" stroke-width="1"/>
        <text x="12" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">
          🚀 <tspan fill="#F8FAFC">Dual Runtime:</tspan> PHP 8.5 &amp; Python 3
        </text>
      </g>

      <!-- Badge 5: Supported Models -->
      <g transform="translate(245, 0)">
        <rect width="375" height="30" rx="6" fill="#0B132B" stroke="#334155" stroke-width="1"/>
        <text x="12" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">
          🌐 <tspan fill="#F8FAFC">Models:</tspan> Claude 3.7 • GPT-4o • Gemini 2.0 • Cursor
        </text>
      </g>
    </g>
  </g>

  <!-- Right Decorative Watermark / Grid Lines -->
  <g transform="translate(970, 70)" opacity="0.15">
    <polygon points="120,0 240,69 240,207 120,276 0,207 0,69" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <polygon points="120,30 214,84 214,192 120,246 26,192 26,84" fill="none" stroke="#C084FC" stroke-width="1.5"/>
    <polygon points="120,60 188,99 188,177 120,216 52,177 52,99" fill="none" stroke="#34D399" stroke-width="1"/>
  </g>
</svg>
